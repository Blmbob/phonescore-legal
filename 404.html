<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — PhoneScore</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="description" content="Cette page PhoneScore n'existe pas ou a été déplacée.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1028">
<style>
  :root{
    --ink:#0A1028; --ink2:#16224E; --blue:#497AEA; --blue-l:#7EA5F5;
    --green:#55AE60; --text:#E8ECF6; --muted:#A8B4CC; --line:rgba(168,180,204,.22);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#16224E 0%,#0A1028 100%);
    background-attachment:fixed; color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased; padding:24px;
  }
  .wrap{max-width:520px; text-align:center}
  .shield{width:64px; height:64px; margin-bottom:18px}
  .mark{font-size:30px; font-weight:800; letter-spacing:-.5px; margin:0 0 6px}
  .mark span{color:var(--blue)}
  .code{color:var(--muted); font-size:14px; letter-spacing:.08em; text-transform:uppercase; margin:0 0 22px}
  h1{font-size:22px; margin:0 0 10px; letter-spacing:-.2px}
  p{color:var(--muted); margin:0 0 26px}
  .links a{
    display:inline-block; margin:6px 8px; padding:11px 18px; border-radius:10px;
    border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:15px;
  }
  .links a.primary{background:rgba(73,122,234,.18); border-color:rgba(73,122,234,.45); color:#fff}
  .links a:hover{border-color:var(--blue-l)}
</style>
</head>
<body>
  <div class="wrap">
    <svg class="shield" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2L4 5.5V11c0 5 3.4 9.4 8 10.5 4.6-1.1 8-5.5 8-10.5V5.5L12 2z" fill="#497AEA"/>
      <path d="M8.5 12l2.4 2.4 4.6-4.8" stroke="#55AE60" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="mark">Phone<span>Score</span></p>
    <p class="code">Erreur 404</p>

    <h1>Cette page n'existe pas</h1>
    <p>
      Le lien est peut-être incomplet, ou la page a été déplacée.
      Vous trouverez l'essentiel depuis l'accueil.
    </p>

    <div class="links">
      <a class="primary" href="/">Retour à l'accueil</a>
      <a href="/cgu.html">Conditions générales</a>
      <a href="/confidentialite.html">Confidentialité</a>
    </div>
  </div>
</body>
</html>
